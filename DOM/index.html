<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Home Products Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="store">
    <h1 id="store-title">Home Products Store</h1>

    <p id="store-description">
      Find smart and useful products for your home.
    </p>

    <div id="offer-box">
      Special Offer: Kitchen products are now on sale!
    </div>

    <section id="products-container" class="products">
      <div class="product-card old-product">
        <h3>Old Product</h3>
        <p>This product should be removed.</p>
      </div>

      <div class="product-card">
        <h3>Wooden Table</h3>
        <p class="product-description">A simple table for your living room.</p>
      </div>
    </section>

    <button id="add-product-btn">Add New Product</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
